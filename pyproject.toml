[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sha256-mcp"
version = "0.1.0"
description = "SHA-256 / Bitcoin demo library plus MCP servers exposing it"
readme = "COMPUTER_USE_TOOL.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0",
]

[project.optional-dependencies]
computer-use = [
    "pyautogui>=0.9.54",
    "mss>=9.0",
    "Pillow>=10.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
sha256-chain-mcp = "src.mcp_servers.sha256_chain_server:main"
computer-use-mcp-py = "src.mcp_servers.computer_use_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
